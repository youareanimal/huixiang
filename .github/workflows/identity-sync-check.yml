name: Identity sync checks
on:
  push:
    branches: ['work/myts-identity-sync']
  pull_request:
    paths: ['app/**', 'tsproto/**', 'docker/**', 'gradle/**', 'gradlew', 'settings.gradle.kts', 'build.gradle.kts', '.github/workflows/identity-sync-check.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare isolated Android build image
        run: docker build -f docker/build.Dockerfile -t huixiang-identity-test --build-arg ACCEPT_ANDROID_SDK_LICENSE=yes docker
      - name: Run protocol and Android tests
        run: |
          mkdir -p out .ci-gradle
          docker run --rm -v "$PWD":/work -v "$PWD/out":/out -v "$PWD/.ci-gradle":/gradle \
            -e POCKETTS_BUILD_ROOT=/out huixiang-identity-test \
            ./gradlew --no-daemon --console=plain :tsproto:test :app:testDebugUnitTest --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:ActiveProcessorCount=2'
