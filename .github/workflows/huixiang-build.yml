name: Build HuiXiang

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
    # 只有真正喂给 Android 构建的输入变了，才值得跑那套八分钟的打包、签名与更新包。
    # 这里用白名单，而不是 paths-ignore：后者的语义是「所有改动文件都命中忽略才跳过」，
    # 顺手改一行 CHANGELOG.md 就会把整条流水线拉起来（PR #29 就是这么发生的）。
    # 网页版（web/**）由 .github/workflows/web.yml 检查。
    # 发版 tag 不受影响：发版提交必然改 app/build.gradle.kts 的版本号，命中 app/**。
    paths: &android-paths
      - "app/**"
      - "tsproto/**"
      - "gradle/**"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "docker/**"
      - "scripts/**"
      - "tools/**"
      - ".github/workflows/huixiang-build.yml"
  pull_request:
    # 同一份白名单：动 app/tsproto/gradle/docker/scripts 之类的 PR 才构建。
    paths: *android-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huixiang-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'youareanimal/huixiang'
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo '::error::Tag does not match the app version'
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify publisher safeguards
        run: python3 scripts/pi-mirror/test-publisher.py

      - name: Prepare Android build environment
        run: |
          docker build -f docker/build.Dockerfile -t huixiang-build --build-arg ACCEPT_ANDROID_SDK_LICENSE=yes docker
          mkdir -p out .ci-gradle dist/unsigned

      - name: Test protocol and Android app
        run: |
          docker run --rm \
            -v "$PWD":/work -v "$PWD/out":/out -v "$PWD/.ci-gradle":/gradle \
            -e POCKETTS_BUILD_ROOT=/out \
            huixiang-build ./gradlew --no-daemon --console=plain \
            :tsproto:test :app:testDebugUnitTest --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:ActiveProcessorCount=2'

      - name: Build unsigned upgrade APKs
        if: github.event_name != 'pull_request'
        env:
          HUIXIANG_UPDATE_HOST: ${{ secrets.PI_SSH_HOST }}
        run: |
          test -n "$HUIXIANG_UPDATE_HOST" || { echo '::error::Private update host is not configured'; exit 1; }
          docker run --rm \
            -v "$PWD":/work -v "$PWD/out":/out -v "$PWD/.ci-gradle":/gradle \
            -e HUIXIANG_UPDATE_HOST \
            -e POCKETTS_BUILD_ROOT=/out -e HUIXIANG_UNSIGNED_BUILD=1 \
            huixiang-build ./gradlew --no-daemon --console=plain \
            :app:assembleCompact --max-workers=2 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:ActiveProcessorCount=2'
          python3 scripts/collect-ci-release.py

      - name: Sign with original upgrade key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.HUIXIANG_KEYSTORE_BASE64 }}
          HUIXIANG_STORE_PASSWORD: ${{ secrets.HUIXIANG_STORE_PASSWORD }}
          HUIXIANG_KEY_PASSWORD: ${{ secrets.HUIXIANG_KEY_PASSWORD }}
          HUIXIANG_KEY_ALIAS: ${{ secrets.HUIXIANG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR=$(mktemp -d "$RUNNER_TEMP/huixiang-key.XXXXXX")
          trap 'rm -rf "$KEY_DIR"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEY_DIR/original.keystore"
          docker run --rm \
            -v "$PWD":/work -v "$KEY_DIR":/keys:ro \
            -e HUIXIANG_STORE_PASSWORD -e HUIXIANG_KEY_PASSWORD -e HUIXIANG_KEY_ALIAS \
            huixiang-build python3 scripts/sign-ci-release.py

      - name: Archive matching source
        if: github.event_name != 'pull_request'
        run: git archive --format=zip --prefix=huixiang/ -o "dist/HuiXiang-$VERSION-source.zip" HEAD

      - name: Prepare online update package
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          cp dist/signed/*.apk dist/
          cp dist/signed/SHA256SUMS.txt "dist/HuiXiang-$VERSION-SHA256SUMS.txt"
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          version = os.environ['VERSION']
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = changelog.split('## 回响 ' + version + ' ', 1)[1]
          notes = section.split('\n', 1)[1].split('\n## ', 1)[0].strip()
          subprocess.run(['python3', 'scripts/prepare-update.py', '--notes', notes], check=True)
          PY
          cp "dist/HuiXiang-$VERSION-SHA256SUMS.txt" dist/update-site/

      - name: Upload online update package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: HuiXiang-${{ env.VERSION }}-online-update
          path: dist/update-site/
          if-no-files-found: error
          retention-days: 30

      - name: Upload build outputs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: HuiXiang-${{ env.VERSION }}-signed
          path: |
            dist/signed/
            dist/HuiXiang-${{ env.VERSION }}-source.zip
            dist/HuiXiang-${{ env.VERSION }}-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HuiXiang-test-reports
          path: |
            out/tsproto/test-results/
            out/app/test-results/
            docs/screenshots/huixiang-051-connect.png
          if-no-files-found: warn
          retention-days: 30
  publish-release:
    if: github.repository == 'youareanimal/huixiang' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download signed release assets
        uses: actions/download-artifact@v7
        with:
          name: HuiXiang-${{ needs.build.outputs.version }}-signed
          path: release-assets

      - name: Verify release assets
        env:
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find release-assets/signed -maxdepth 1 -type f -name '*.apk' -print | sort)
          test "${#APKS[@]}" -eq 1
          [[ "${APKS[0]}" == *-arm64-v8a.apk ]]
          test -s "release-assets/HuiXiang-$VERSION-SHA256SUMS.txt"
          test -s "release-assets/HuiXiang-$VERSION-source.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find release-assets/signed -maxdepth 1 -type f -name '*.apk' -print | sort)
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## 回响 {version} ("
          start = changelog.find(heading)
          if start < 0:
              raise SystemExit(f"Missing changelog section for {version}")
          body_start = changelog.find("\n", start)
          next_section = changelog.find("\n## ", body_start + 1)
          notes = changelog[body_start + 1: next_section if next_section >= 0 else None].strip()
          if not notes:
              raise SystemExit("Release notes are empty")
          notes += "\n\n## 安装\n\n下载 arm64-v8a 版本 APK，适用于 ARM64 设备，可直接覆盖安装。安装包使用原发行证书签名。\n"
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes, encoding="utf-8")
          PY
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish."
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            gh release create "$TAG" "${APKS[@]}" \
              "release-assets/HuiXiang-$VERSION-SHA256SUMS.txt" \
              "release-assets/HuiXiang-$VERSION-source.zip" \
              --verify-tag --title "回响 $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists without a release; refusing to attach assets to an old commit."
              exit 1
            fi
            gh release create "$TAG" "${APKS[@]}" \
              "release-assets/HuiXiang-$VERSION-SHA256SUMS.txt" \
              "release-assets/HuiXiang-$VERSION-source.zip" \
              --target "$GITHUB_SHA" --title "回响 $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

