name: Inspect public TS6 user tag protocol
on:
  push:
    branches: [research/user-tag-native-inspection]
    paths: [.github/workflows/research-user-tag.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect pinned public client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 180 --retry 2 -o /tmp/ts-client.tar.xz https://files.teamspeak-services.com/pre_releases/client/6.0.0-beta5/teamspeak-client.tar.xz
          echo '394472a25ee9c2419c44a5e71a401c21bffecf2fdcb27fbe2173d0fffd1875a4  /tmp/ts-client.tar.xz' | sha256sum -c -
          mkdir /tmp/ts-client
          tar -xJf /tmp/ts-client.tar.xz -C /tmp/ts-client
          echo '1189672c2c290997a419100b0f29f4da95d0df9d1e744b07a764eba1e8a0944f  /tmp/ts-client/TeamSpeak' | sha256sum -c -
          python3 - <<'PY'
          import os,subprocess,re
          for p in ['/tmp/ts-client/TeamSpeak','/tmp/ts-client/libtschat_client_lib_export.so']:
              print('BINARY',p,flush=True)
              for cmd in [['nm','-D','-C',p],['go','tool','nm',p],['strings','-a',p]]:
                  try:
                      result=subprocess.run(cmd,stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True,errors='replace',timeout=90)
                      matches=[x for x in result.stdout.splitlines() if re.search(r'verify.?identifier|identifier.?token|token.?identifier|myts_token|signedallowedidentifier',x,re.I)]
                      print('TOOL',cmd[:3],'matches',len(matches),flush=True)
                      for x in matches[:100]: print('FOUND',x[:1200],flush=True)
                  except Exception as e: print('TOOL_FAIL',type(e).__name__,flush=True)
          PY
