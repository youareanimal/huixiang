name: Inspect public TS6 user tag protocol
on:
  push:
    branches: [research/user-tag-native-inspection]
    paths: [.github/workflows/research-user-tag.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect pinned public client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 180 --retry 2 -o /tmp/ts-client.tar.xz https://files.teamspeak-services.com/pre_releases/client/6.0.0-beta5/teamspeak-client.tar.xz
          echo '394472a25ee9c2419c44a5e71a401c21bffecf2fdcb27fbe2173d0fffd1875a4  /tmp/ts-client.tar.xz' | sha256sum -c -
          mkdir /tmp/ts-client
          tar -xJf /tmp/ts-client.tar.xz -C /tmp/ts-client
          echo '1189672c2c290997a419100b0f29f4da95d0df9d1e744b07a764eba1e8a0944f  /tmp/ts-client/TeamSpeak' | sha256sum -c -
          python3 - <<'PY'
          import os,re,subprocess
          p='/tmp/ts-client/html/client_ui/main.js'
          data=open(p,'rb').read().decode('utf8','replace')
          for term in ['userHomeServerData','verifiedGlobalChatAlias','getIdentifierToken','tschat_verifyIdentifierToken','SetClientSelfProperties','setIdentifierOnAllServerConnections','myts_token']:
              print('TRACE',term,flush=True)
              for m in list(re.finditer(re.escape(term),data))[:12]:
                  print('OFFSET',m.start(),data[max(0,m.start()-550):m.start()+950],flush=True)
          for root, dirs, files in os.walk('/tmp/ts-client'):
              for name in files:
                  if 'tschat' in name.lower() or ('chat' in name.lower() and name.endswith('.so')):
                      p=os.path.join(root,name)
                      print('CHAT_FILE',p,os.path.getsize(p),flush=True)
                      if os.path.isfile(p) and os.path.getsize(p)<350000000:
                          out=subprocess.run(['strings','-a',p],stdout=subprocess.PIPE,text=True,errors='replace').stdout
                          matches=[x for x in out.splitlines() if re.search('verifyIdentifier|IdentifierToken|getIdentifier|identifier.*token|token.*identifier',x,re.I) and len(x)<500]
                          for x in matches[:120]: print('CHAT_STRING',x,flush=True)
          PY
