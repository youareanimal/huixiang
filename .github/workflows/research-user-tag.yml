name: Inspect public TS6 user tag protocol
on:
  push:
    branches: [research/user-tag-native-inspection]
    paths: [.github/workflows/research-user-tag.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect pinned public client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 180 --retry 2 -o /tmp/ts-client.tar.xz https://files.teamspeak-services.com/pre_releases/client/6.0.0-beta5/teamspeak-client.tar.xz
          echo '394472a25ee9c2419c44a5e71a401c21bffecf2fdcb27fbe2173d0fffd1875a4  /tmp/ts-client.tar.xz' | sha256sum -c -
          mkdir /tmp/ts-client
          tar -xJf /tmp/ts-client.tar.xz -C /tmp/ts-client
          echo '1189672c2c290997a419100b0f29f4da95d0df9d1e744b07a764eba1e8a0944f  /tmp/ts-client/TeamSpeak' | sha256sum -c -
          go install github.com/mandiant/GoReSym@722897e0a80da0a06c00c5e40591a253a551f04e
          "$(go env GOPATH)/bin/GoReSym" -t -p /tmp/ts-client/libtschat_client_lib_export.so > /tmp/symbols.json
          python3 - <<'PY'
          import json,subprocess,re,bisect
          data=json.load(open('/tmp/symbols.json'))
          funcs=data.get('UserFunctions',[])+data.get('StdFunctions',[])
          funcs=[f for f in funcs if isinstance(f,dict) and isinstance(f.get('Start'),int)]
          funcs.sort(key=lambda x:x['Start']); starts=[x['Start'] for x in funcs]
          def sym(addr):
              i=bisect.bisect_right(starts,addr)-1
              return funcs[i].get('FullName','') if i>=0 and addr<funcs[i].get('End',0) else ''
          targets=[f for f in funcs if re.search(r'CreateMyTSIDVerificationToken|VerifyMyTSIDVerificationToken|CreateTsChatMyTsIdToken|VerifyTsChatMyTsIdToken|TsChatMyTsIdTokenStillValid',f.get('FullName','')) and f.get('PackageName')=='tschat_client_lib/myts']
          names={f['Start']:f['FullName'] for f in targets}
          print('TARGETS',names,flush=True)
          p=subprocess.Popen(['objdump','-d','-M','intel','/tmp/ts-client/libtschat_client_lib_export.so'],stdout=subprocess.PIPE,text=True,errors='replace')
          pat=re.compile(r'^\s*([0-9a-f]+):.*\bcall\s+([0-9a-f]+)')
          callers={}
          for line in p.stdout:
              m=pat.search(line)
              if not m: continue
              source,target=int(m.group(1),16),int(m.group(2),16)
              if target in names:
                  caller=sym(source); print('CALLER',hex(source),caller,'TARGET',names[target],flush=True)
                  callers[caller]=True
          p.wait()
          for f in funcs:
              name=f.get('FullName','')
              if name in callers or (f.get('PackageName','').startswith('tschat_client_lib/') and re.search(r'profile|verification|identifier|presence',name,re.I)):
                  print('FUNCTION',f,flush=True)
          PY
