name: Inspect public TS6 user tag protocol
on:
  push:
    branches: [research/user-tag-native-inspection]
    paths: [.github/workflows/research-user-tag.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect pinned public client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 180 --retry 2 -o /tmp/ts-client.tar.xz https://files.teamspeak-services.com/pre_releases/client/6.0.0-beta5/teamspeak-client.tar.xz
          echo '394472a25ee9c2419c44a5e71a401c21bffecf2fdcb27fbe2173d0fffd1875a4  /tmp/ts-client.tar.xz' | sha256sum -c -
          mkdir /tmp/ts-client
          tar -xJf /tmp/ts-client.tar.xz -C /tmp/ts-client
          echo '1189672c2c290997a419100b0f29f4da95d0df9d1e744b07a764eba1e8a0944f  /tmp/ts-client/TeamSpeak' | sha256sum -c -
          echo 'RESEARCH VTABLE'
          objdump -s --start-address=0x4a21e80 --stop-address=0x4a21f90 /tmp/ts-client/TeamSpeak
          readelf -rW /tmp/ts-client/TeamSpeak | awk 'tolower($1) ~ /^0000000004a21e|^0000000004a21f/'
          echo 'RESEARCH DYNAMIC SYMBOLS'
          nm -DC /tmp/ts-client/TeamSpeak | grep -iE 'verifyIdentifier|IdentifierToken|tschat' | head -n 80 || true
