name: Inspect public TS6 user tag protocol
on:
  push:
    branches: [research/user-tag-native-inspection]
    paths: [.github/workflows/research-user-tag.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect pinned public client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 180 --retry 2 -o /tmp/ts-client.tar.xz https://files.teamspeak-services.com/pre_releases/client/6.0.0-beta5/teamspeak-client.tar.xz
          echo '394472a25ee9c2419c44a5e71a401c21bffecf2fdcb27fbe2173d0fffd1875a4  /tmp/ts-client.tar.xz' | sha256sum -c -
          mkdir /tmp/ts-client
          tar -xJf /tmp/ts-client.tar.xz -C /tmp/ts-client
          echo '1189672c2c290997a419100b0f29f4da95d0df9d1e744b07a764eba1e8a0944f  /tmp/ts-client/TeamSpeak' | sha256sum -c -
          python3 - <<'PY'
          import collections, re, struct, subprocess
          path = '/tmp/ts-client/TeamSpeak'
          data = open(path, 'rb').read()
          phoff = struct.unpack_from('<Q', data, 32)[0]
          entsize, count = struct.unpack_from('<HH', data, 54)
          segs = [struct.unpack_from('<IIQQQQQQ', data, phoff + i * entsize) for i in range(count)]
          needles = [b'client_user_tag', b'user_tag', b'updatemytsid', b'clientupdate']
          addresses = {}
          for term in needles:
              pos = 0
              while True:
                  pos = data.find(term + b'\x00', pos)
                  if pos < 0: break
                  if pos == 0 or data[pos-1] == 0:
                      for typ, flags, off, va, pa, filesz, memsz, align in segs:
                          if typ == 1 and off <= pos < off + filesz:
                              addresses[va + pos - off] = term.decode()
                              print('STRING', term.decode(), hex(va + pos - off), flush=True)
                  pos += len(term)
          pattern = re.compile(r'#\s*([0-9a-f]+)')
          p = subprocess.Popen(['objdump', '-d', '-M', 'intel', path], stdout=subprocess.PIPE, text=True, errors='replace')
          before = collections.deque(maxlen=8)
          after = 0
          hits = 0
          for line in p.stdout:
              m = pattern.search(line)
              addr = int(m.group(1), 16) if m else -1
              if addr in addresses and hits < 100:
                  print('\nXREF', addresses[addr], hex(addr))
                  print(''.join(before), end='')
                  print(line, end='')
                  after = 12
                  hits += 1
              elif after:
                  print(line, end='')
                  after -= 1
              before.append(line)
          rc = p.wait()
          print('TOTAL_XREFS', hits, 'OBJDUMP_STATUS', rc)
          if rc: raise SystemExit(rc)
          PY
          python3 - <<'PY'
          import re, struct, subprocess
          path = '/tmp/ts-client/TeamSpeak'
          data = open(path, 'rb').read()
          phoff = struct.unpack_from('<Q', data, 32)[0]
          entsize, count = struct.unpack_from('<HH', data, 54)
          segs = [struct.unpack_from('<IIQQQQQQ', data, phoff + i * entsize) for i in range(count)]
          def findtext(va):
              for typ, flags, off, base, pa, filesz, memsz, align in segs:
                  if typ == 1 and base <= va < base + filesz:
                      pos = off + va - base
                      raw = data[pos:pos+120].split(b'\0',1)[0]
                      if len(raw) >= 3 and all(32 <= x < 127 for x in raw): return raw.decode()
              return ''
          for start, stop in [(0x2717090,0x27171d0),(0x27aad70,0x27ab240),(0x45816c0,0x45817f0)]:
              print('FUNCTION_RANGE',hex(start),hex(stop),flush=True)
              output = subprocess.check_output(['objdump','-d','-M','intel','--start-address='+hex(start),'--stop-address='+hex(stop),path],text=True,errors='replace')
              for line in output.splitlines():
                  m = re.search(r'#\s*([0-9a-f]+)',line)
                  hint = findtext(int(m.group(1),16)) if m else ''
                  print(line + ('  STRING='+hint if hint else ''))
          PY
          python3 - <<'PY'
          import os,re
          terms = [b'client_user_tag', b'user_tag', b'UserTag', b'userTag', b'@myteamspeak.com']
          for root, _, files in os.walk('/tmp/ts-client'):
              for name in files:
                  if not name.endswith(('.js','.html','.json')): continue
                  p=os.path.join(root,name)
                  if os.path.getsize(p)>50000000: continue
                  data=open(p,'rb').read()
                  for term in terms:
                      positions=[m.start() for m in re.finditer(re.escape(term),data)]
                      if positions:
                          print('TEXT_MATCH',p,term.decode(),'count',len(positions))
                          for pos in positions[:12]:
                              print(repr(data[max(0,pos-170):pos+len(term)+170].decode('utf-8','replace')))
          PY
          python3 - <<'PY'
          import re
          data=open('/tmp/ts-client/html/client_ui/main.js','rb').read().decode('utf-8','replace')
          for term in ['myts_token','SetClientSelfProperties(s,!0)','updateUserHomeServer','tschat_verifyIdentifierToken','parsedUserTagInfo','updateUserHomeServerId']:
              print('TRACE',term,flush=True)
              for m in list(re.finditer(re.escape(term),data))[:15]:
                  print('OFFSET',m.start(),data[max(0,m.start()-1200):m.start()+1700],flush=True)
          PY
          python3 - <<'PY'
          import re, subprocess
          data=open('/tmp/ts-client/html/client_ui/main.js','rb').read().decode('utf-8','replace')
          for term in ['primaryIdentifier','identifierMapping','getActiveIdentifierList','getAllowedIdentifierList','setIdentifierOnAllServerConnections']:
              print('SOURCE_TRACE',term,flush=True)
              for m in list(re.finditer(re.escape(term),data))[:15]:
                  print('OFFSET',m.start(),data[max(0,m.start()-600):m.start()+800],flush=True)
          for f in ['/tmp/ts-client/TeamSpeak']:
              output=subprocess.check_output(['strings','-a',f],text=True,errors='replace')
              lines=[x for x in output.splitlines() if re.search(r'identifier|alias|user.?tag',x,re.I) and len(x)<250]
              print('BINARY_MATCHES',len(lines))
              for x in lines[:400]: print(x)
          PY
