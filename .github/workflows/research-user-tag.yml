name: Inspect public TS6 user tag protocol
on:
  push:
    branches: [research/user-tag-native-inspection]
    paths: [.github/workflows/research-user-tag.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Inspect pinned public client
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --max-time 180 --retry 2 -o /tmp/ts-client.tar.xz https://files.teamspeak-services.com/pre_releases/client/6.0.0-beta5/teamspeak-client.tar.xz
          echo '394472a25ee9c2419c44a5e71a401c21bffecf2fdcb27fbe2173d0fffd1875a4  /tmp/ts-client.tar.xz' | sha256sum -c -
          mkdir /tmp/ts-client
          tar -xJf /tmp/ts-client.tar.xz -C /tmp/ts-client
          echo '1189672c2c290997a419100b0f29f4da95d0df9d1e744b07a764eba1e8a0944f  /tmp/ts-client/TeamSpeak' | sha256sum -c -
          python3 -m pip install --quiet pyelftools
          python3 - <<'PY'
          from elftools.elf.elffile import ELFFile
          import subprocess
          p='/tmp/ts-client/TeamSpeak'
          with open(p,'rb') as fh:
              elf=ELFFile(fh)
              relocs={}
              for section in elf.iter_sections():
                  if section.name.startswith('.rela'):
                      for rel in section.iter_relocations():
                          if rel['r_info_type']==8:
                              relocs[rel['r_offset']]=rel['r_addend']
              reverse={}
              for k,v in relocs.items(): reverse.setdefault(v,[]).append(k)
              sections=[s for s in elf.iter_sections() if s['sh_type']=='SHT_PROGBITS' and s['sh_flags'] & 2]
              for sec in sections:
                  data=sec.data()
                  marker=b'N3com9teamspeak6client2ui22TSBindingBrowserTSChatE'
                  at=0
                  while True:
                      pos=data.find(marker,at)
                      if pos<0: break
                      at=pos+1
                      address=sec['sh_addr']+pos
                      print('TYPE',hex(address),flush=True)
                      for ptr in reverse.get(address,[]):
                          rtti=ptr-8
                          print('TYPEINFO',hex(rtti),flush=True)
                          for vtref in reverse.get(rtti,[]):
                              vt=vtref+8
                              print('VTABLE',hex(vt),'METHOD_218',hex(relocs.get(vt+0x218,0)),flush=True)
                              target=relocs.get(vt+0x218,0)
                              if target:
                                  print(subprocess.check_output(['objdump','-d','-M','intel','--start-address='+hex(target),'--stop-address='+hex(target+0x900),p],text=True,errors='replace'),flush=True)
          PY
