# Public router TCP 8443 -> PI TCP 8443. Existing internal 443 also remains available.
server {
    listen 443 ssl http2;
    listen 8443 ssl http2;
    server_name pi.animal26.site;
    server_tokens off;

    ssl_certificate /www/sites/huixiang-mirror/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/huixiang-mirror/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/huixiang-mirror.access.log;
    error_log /var/log/nginx/huixiang-mirror.error.log;

    location = /huixiang/ {
        rewrite ^ /huixiang/index.html last;
    }

    location = /huixiang/index.html {
        alias /www/sites/huixiang-mirror/public/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
    }

    location = /huixiang/latest.json {
        alias /www/sites/huixiang-mirror/public/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        limit_except GET { deny all; }
    }

    location ^~ /huixiang/ {
        alias /www/sites/huixiang-mirror/public/;
        autoindex off;
        disable_symlinks on;
        sendfile on;
        etag on;
        types {
            application/vnd.android.package-archive apk;
            application/zip zip;
            text/plain txt;
            text/html html;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        limit_except GET { deny all; }
    }

    location / { return 404; }
}
